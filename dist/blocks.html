/* ===== Winamp black-steel skin ===== */
body{background:var(--bg) repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);font-size:15px}
h1,h2,h3{letter-spacing:.02em}
h3{font-family:var(--f-display);font-size:.72rem;letter-spacing:.14em;color:var(--gold)}
.wtitle{display:flex;align-items:center;gap:10px;height:20px;margin:-14px -14px 4px;padding:0 8px;background:linear-gradient(180deg,var(--title-1),var(--title-2));border-bottom:1px solid #000;font:bold 11px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:#d9d9e4;white-space:nowrap}
.wtitle::before,.wtitle::after{content:"";flex:1;height:9px;background:repeating-linear-gradient(180deg,var(--gold) 0 1px,var(--gold-dark) 1px 2px,transparent 2px 3px)}
.panel,.list,.ahead,.syncbar,.sheet,.bellpanel,.pop,.owner,.review,.sharebox,.pt,.scanbox,.slackbar,.cmtbox,.actsum,.note,.reply,.hits,.msgs{border-radius:2px}
.panel,.ahead,.syncbar,.sheet,.bellpanel,.pop,.deck{background:linear-gradient(180deg,var(--steel-a) 0%,var(--steel-b) 45%,var(--steel-c) 100%);border:2px solid;border-color:var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);box-shadow:var(--shadow)}
.panel{padding:14px}
.lcd{background:var(--lcd-bg);border:2px solid;border-color:var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);color:var(--lcd);font-family:var(--f-mono);padding:10px 12px}
header.top{display:block}
header.top .deck{padding:14px;display:flex;flex-direction:column;gap:10px}
header.top .hrow{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:space-between}
header.top .lcd{flex:1 1 420px;min-width:0}
header.top h1{font-family:var(--f-mono);font-weight:400;font-size:clamp(1.9rem,4vw,2.8rem);line-height:1;color:var(--lcd);text-shadow:0 0 6px rgba(0,224,0,.45);letter-spacing:.04em}
header.top .lede{color:var(--lcd-dim);font-family:var(--f-mono);font-size:1.15rem;line-height:1.2;margin-top:6px;max-width:none}
.badge-owner{border-radius:2px;background:#000;color:var(--gold);border:1px solid var(--gold-dark);font-family:var(--f-mono);font-size:1rem}
/* buttons */
.btn,.tabs button,.seg button,.autopick button,.bell,.mover button,.revq{background:linear-gradient(180deg,var(--key-1),var(--key-2));color:#e6e6ee;border:1px solid;border-color:#727589 #0e0f13 #0e0f13 #727589;border-radius:2px;box-shadow:none}
.btn:hover,.tabs button:hover,.seg button:hover,.autopick button:hover,.bell:hover{background:linear-gradient(180deg,var(--key-hover-1),var(--key-hover-2))}
.btn:active,.tabs button:active,.seg button:active,.autopick button:active{border-color:#0e0f13 #727589 #727589 #0e0f13}
.btn.primary{background:linear-gradient(180deg,#3f6b3f,#1f3a1f);color:#c8ffc8;border-color:#6fa86f #0a140a #0a140a #6fa86f}
.btn.danger{background:linear-gradient(180deg,#5a2c2c,#331616);color:#ffb3ad;border-color:#8a4a4a #140808 #140808 #8a4a4a}
.btn.link{background:none;border:none;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.btn.link:hover{background:none;color:#9dff9d}
.seg button[aria-pressed=true],.tabs button[aria-pressed=true]{background:#000;color:var(--lcd);border-color:#0e0f13 #727589 #727589 #0e0f13;box-shadow:inset 0 0 6px rgba(0,224,0,.25)}
.seg button.u-normal[aria-pressed=true]{background:#000;color:var(--lcd);border-color:#0e0f13 #727589 #727589 #0e0f13}
/* inputs */
input[type=text],select,textarea{background:#000;color:#cfeccf;border:2px solid;border-color:var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);border-radius:0;caret-color:var(--lcd);font-family:var(--f-body)}
input::placeholder,textarea::placeholder{color:#4f6b4f}
select option{background:#111;color:#e4e4ec}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
/* LCD bits */
.code,.mono,.steps,.tabs button .n,.rank,.bell .count,.item .side,.ahead .stats{font-family:var(--f-mono);font-size:1.02rem;letter-spacing:.03em}
.steps span{background:#000;color:var(--lcd-dim);border-radius:0;font-size:.9rem;white-space:nowrap;padding:2px 6px}
#composer>.row:first-child{flex-wrap:wrap;gap:6px}
@media (max-width:640px){header.top .lede{font-size:1rem}}
.steps span.on{background:#000;color:var(--lcd)}
.bell .count{background:#000;color:#ff5f56;border:1px solid #5a1e1e;border-radius:0}
/* posting deck vs filter window */
.postto{display:flex;flex-direction:column;gap:6px}
.postto .hint{color:var(--muted);font-size:.8rem}
.autopick button{position:relative;padding-left:30px}
.autopick button::before{content:"";position:absolute;left:10px;top:13px;width:11px;height:11px;border-radius:50%;background:#000;border:1px solid #727589;box-shadow:inset 1px 1px 2px #000}
.autopick button[aria-pressed=true]{background:#000;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.autopick button[aria-pressed=true]::before{background:var(--c);box-shadow:0 0 6px var(--c)}
.autopick button b{color:#e6e6ee}
.posts{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{align-items:center;background:#000;border:2px solid;border-color:var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);padding:6px}
.showlbl{font-family:var(--f-mono);font-size:1.15rem;color:var(--gold);padding:0 6px 0 2px;letter-spacing:.08em}
.tabs button{font-size:.82rem}
/* playlist */
.list{background:#000;border:2px solid;border-color:var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo)}
.item,.rowwrap{border-top:1px solid #10221a}
.item:hover,.rowwrap:hover .item{background:var(--sel)}
.item .t{font-family:var(--f-body);font-weight:700;color:var(--lcd);font-size:1rem}
.item .s{color:#8fbf8f}
.item .meta{color:#7d8296}
.item .side{color:var(--lcd-dim)}
.mover{border-left:1px solid #10221a;background:#050505}
.rank{color:var(--lcd-dim)}
.empty{color:var(--lcd-dim);font-family:var(--f-mono);font-size:1.1rem}
.empty b{color:var(--lcd);font-family:var(--f-mono);font-size:1.4rem;font-weight:400}
.filters{background:transparent}
.ahead{border-left:4px solid var(--c)}
.ahead h2{color:var(--c)}
/* sheet & misc */
.sheet{border-radius:0}
.sheet h2{color:var(--lcd);font-family:var(--f-body)}
.scrim{background:rgba(0,0,0,.6)}
.toast{background:#000;color:var(--lcd);border:1px solid var(--lcd-dim);font-family:var(--f-mono);font-size:1.1rem;border-radius:0}
.pill{border-radius:2px;background:#000}
.note{background:#0c0c10;border:1px solid #2a2c38}
.reply{background:#0c1a0c;border:1px solid #234a23}
.owner{border:1px dashed var(--gold-dark);background:rgba(0,0,0,.25)}
.review{background:#14111c;border-left-color:var(--tatey)}
.cmtbox,.sharebox,.actsum,.pt,.slackbar{background:rgba(0,0,0,.35);border:1px solid #2f3140}
.cmt.act{background:rgba(0,0,0,.35)}
.fitem.new{background:#0d200d}
.fitem:hover,.hit:hover,.msg:hover{background:var(--sel)}
.hits,.msgs{background:#000}
.quote{border-left-color:var(--gold-dark)}
.lchip{background:#000;border-radius:2px;border-color:#2f3140}
.thumb{border-radius:0;border-color:#000}
.who img,.cmt img{border-radius:0}
.lightbox{background:rgba(0,0,0,.92)}
@media (max-width:640px){ .wtitle{letter-spacing:.12em} }

.panel,.ahead,.syncbar,.sheet,.bellpanel,.pop,.deck{background-image:var(--brushed),var(--grain),repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,rgba(0,0,0,.04) 1px 2px),linear-gradient(180deg,var(--steel-a) 0%,var(--steel-b) 45%,var(--steel-c) 100%);background-size:600px 300px,600px 300px,auto,auto}
.btn,.tabs button,.seg button,.autopick button,.bell,.mover button,.revq{background-image:var(--brushed),linear-gradient(180deg,var(--key-1),var(--key-2));background-size:600px 300px,auto}
.btn.primary{background-image:var(--brushed),linear-gradient(180deg,#3f6b3f,#1f3a1f);background-size:600px 300px,auto}
.btn.danger{background-image:var(--brushed),linear-gradient(180deg,#5a2c2c,#331616);background-size:600px 300px,auto}
.btn.link{background:none}
.seg button[aria-pressed=true],.tabs button[aria-pressed=true],.autopick button[aria-pressed=true]{background-image:var(--scratch),var(--sheen);background-color:#000;background-size:400px 300px,auto}
/* glow on black displays */
.lcd,.lcd *,.list .t,.tabs button[aria-pressed=true],.seg button[aria-pressed=true],.steps span,.code,.toast,.empty,.empty b,.showlbl,.rank,.item .side{text-shadow:0 0 3px rgba(0,224,0,.38),0 0 1px rgba(0,224,0,.5)}
.code{text-shadow:0 0 3px color-mix(in srgb,currentColor 50%,transparent)}
.showlbl,.badge-owner{text-shadow:0 0 4px rgba(226,200,107,.45)}
.item .s{text-shadow:0 0 2px rgba(120,220,120,.25)}
input[type=text],textarea,select{text-shadow:0 0 2px rgba(150,255,150,.35);background-image:var(--scratch),var(--sheen);background-color:#000;background-size:400px 300px,auto;background-attachment:local,scroll}
.bell .count{text-shadow:0 0 4px rgba(255,95,86,.6)}
/* scratched glass over the black windows */
.lcd,.list,.tabs,.hits,.msgs,.toast,.steps span{position:relative}
.lcd::after,.list::after,.tabs::after,.hits::after,.msgs::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--scratch),var(--sheen);background-size:400px 300px,100% 100%;mix-blend-mode:screen;opacity:.9;z-index:2}

  --spec:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.02) 18%,rgba(255,255,255,0) 40%,rgba(0,0,0,.10) 100%);
  --streak:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.07) 22%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 60%,rgba(255,255,255,.05) 70%,rgba(255,255,255,0) 82%);
  --glass:linear-gradient(118deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 16%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 58%,rgba(255,255,255,.06) 66%,rgba(255,255,255,0) 76%);
  --glow-g:0 0 1px #b8ffb8,0 0 3px rgba(60,255,90,.85),0 0 8px rgba(40,255,70,.55),0 0 16px rgba(30,230,60,.35);
  --glow-g-soft:0 0 1px rgba(184,255,184,.6),0 0 4px rgba(60,255,90,.5),0 0 10px rgba(30,230,60,.25);
  --glow-a:0 0 1px #fff2c2,0 0 3px rgba(255,200,80,.85),0 0 8px rgba(255,170,40,.5),0 0 16px rgba(255,150,20,.3);
  --glow-r:0 0 1px #ffd0cc,0 0 3px rgba(255,80,60,.9),0 0 9px rgba(255,60,40,.5);
  --lcd:#4dff6a; --lcd-dim:#3fbf55}
.panel,.ahead,.syncbar,.sheet,.bellpanel,.pop,.deck{background-image:var(--spec),var(--streak),var(--brushed2),linear-gradient(180deg,var(--plate-1) 0%,var(--plate-2) 45%,var(--plate-3) 100%);background-size:auto,auto,800px 400px,auto;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.6)}
.btn,.tabs button,.seg button,.autopick button,.bell,.mover button,.revq{background-image:var(--spec),var(--brushed2),linear-gradient(180deg,var(--key-1),var(--key-2));background-size:auto,800px 400px,auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary{background-image:var(--spec),var(--brushed2),linear-gradient(180deg,#467a46,#1f3a1f);background-size:auto,800px 400px,auto}
.btn.danger{background-image:var(--spec),var(--brushed2),linear-gradient(180deg,#653232,#331616);background-size:auto,800px 400px,auto}
.btn.link{background:none;box-shadow:none}
/* backlit displays: uneven backlight, recessed glass */
.lcd,.list,.tabs,.hits,.msgs{background-color:#010401;background-image:radial-gradient(ellipse at 35% 40%,rgba(40,255,80,.075),rgba(40,255,80,.02) 45%,rgba(0,0,0,0) 70%),radial-gradient(ellipse at 80% 70%,rgba(40,255,80,.04),rgba(0,0,0,0) 55%);box-shadow:inset 0 0 18px rgba(0,0,0,.95),inset 0 2px 6px rgba(0,0,0,.9)}
input[type=text],textarea,select{background-color:#010401;background-image:var(--scratch2),var(--glass),radial-gradient(ellipse at 30% 50%,rgba(40,255,80,.06),rgba(0,0,0,0) 70%);background-size:500px 360px,auto,auto;box-shadow:inset 0 0 10px rgba(0,0,0,.95);color:#a8ffb4;text-shadow:var(--glow-g-soft)}
.lcd::after,.list::after,.tabs::after,.hits::after,.msgs::after{background-image:var(--scratch2),var(--glass);background-size:500px 360px,100% 100%;opacity:1;mix-blend-mode:screen;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.seg button[aria-pressed=true],.tabs button[aria-pressed=true],.autopick button[aria-pressed=true]{background-image:var(--scratch2),var(--glass),radial-gradient(ellipse at 50% 50%,rgba(40,255,80,.12),rgba(0,0,0,0) 75%);background-size:500px 360px,auto,auto;background-color:#010401;box-shadow:inset 0 0 8px rgba(0,0,0,.95)}
/* dashboard lighting */
header.top h1{color:#7dff8e;text-shadow:var(--glow-g);letter-spacing:.06em}
header.top .lede{color:#3fe05a;text-shadow:var(--glow-g-soft)}
.lcd *, .list .t,.tabs button[aria-pressed=true],.seg button[aria-pressed=true],.steps span.on,.toast,.empty b,.rank,.item .side{color:var(--lcd);text-shadow:var(--glow-g)}
.list .t{color:#6dff82}
.item .s{color:#8fe09c;text-shadow:var(--glow-g-soft)}
.steps span{color:#2a8f3c;text-shadow:0 0 3px rgba(40,200,70,.35)}
.code{text-shadow:0 0 1px #fff,0 0 4px currentColor,0 0 10px currentColor}
.showlbl{color:#ffc95a;text-shadow:var(--glow-a)}
.badge-owner{color:#ffc95a;text-shadow:var(--glow-a);background:#090500;box-shadow:inset 0 0 8px rgba(0,0,0,.9)}
.bell .count{color:#ff6a5a;text-shadow:var(--glow-r);background:#0a0101}
.empty{text-shadow:var(--glow-g-soft)}
.autopick button[aria-pressed=true] b{color:#e8ffe8;text-shadow:var(--glow-g-soft)}
.tabs button:not([aria-pressed=true]) .n{color:#9aa0b0}

/* ===== v3: turned up ===== */
:root{
  --glow-g:0 0 1px #e0ffe0,0 0 3px rgba(90,255,120,1),0 0 9px rgba(50,255,90,.8),0 0 20px rgba(40,240,80,.55),0 0 34px rgba(30,220,60,.3);
  --glow-g-soft:0 0 1px rgba(220,255,220,.8),0 0 4px rgba(70,255,100,.75),0 0 12px rgba(40,240,80,.45);
  --glow-a:0 0 1px #fff6d6,0 0 4px rgba(255,205,90,1),0 0 11px rgba(255,170,40,.7),0 0 22px rgba(255,150,20,.45);
  --glow-r:0 0 1px #ffe0dc,0 0 4px rgba(255,90,70,1),0 0 12px rgba(255,60,40,.65);
  --glass:linear-gradient(118deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.07) 14%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 55%,rgba(255,255,255,.09) 63%,rgba(255,255,255,.02) 70%,rgba(255,255,255,0) 78%);
  --streak:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.12) 20%,rgba(255,255,255,0) 33%,rgba(255,255,255,0) 58%,rgba(255,255,255,.09) 69%,rgba(255,255,255,0) 82%);
}
.panel,.ahead,.syncbar,.sheet,.bellpanel,.pop,.deck{background-image:var(--spec),var(--streak),var(--brushed2),var(--brushed2),linear-gradient(180deg,var(--plate-1) 0%,var(--plate-2) 45%,var(--plate-3) 100%);background-size:auto,auto,800px 400px,1200px 260px,auto;background-position:0 0,0 0,0 0,137px 61px,0 0}
.btn,.tabs button,.seg button,.autopick button,.bell,.mover button,.revq{background-image:var(--spec),var(--brushed2),var(--brushed2),linear-gradient(180deg,var(--key-1),var(--key-2));background-size:auto,800px 400px,1200px 260px,auto;background-position:0 0,0 0,91px 33px,0 0}
.lcd::after,.list::after,.tabs::after,.hits::after,.msgs::after{background-image:var(--scratch2),var(--scratch2),var(--glass);background-size:500px 360px,700px 504px,100% 100%;background-position:0 0,233px 117px,0 0;filter:brightness(1.6)}
input[type=text],textarea,select{background-image:var(--scratch2),var(--glass),radial-gradient(ellipse at 30% 50%,rgba(40,255,80,.09),rgba(0,0,0,0) 70%)}
.lcd,.list,.tabs,.hits,.msgs{background-image:radial-gradient(ellipse at 35% 40%,rgba(40,255,80,.12),rgba(40,255,80,.035) 45%,rgba(0,0,0,0) 72%),radial-gradient(ellipse at 82% 70%,rgba(40,255,80,.06),rgba(0,0,0,0) 55%)}
header.top h1{color:#a6ffb2}
.list .t{color:#7dff90}

/* ===== v5: multi-colour dash lights + readable depth ===== */
:root{
  --blue:#8fe3ff; --orange:#ffb35a; --purple:#cdb6ff; --pink:#ff8fd2;
  --lcd:var(--blue); --lcd-dim:#9fcfe6; --accent:#8fe3ff; --accent-soft:#12304a;
  --glow-b:0 0 1px rgba(230,250,255,.9),0 0 4px rgba(110,210,255,.85),0 0 12px rgba(80,180,255,.5),0 0 24px rgba(60,150,255,.3);
  --glow-b-tight:0 0 1px rgba(230,250,255,.7),0 0 3px rgba(110,210,255,.55);
  --glow-o-tight:0 0 1px rgba(255,240,220,.7),0 0 3px rgba(255,160,60,.6);
  --glow-p-tight:0 0 2px rgba(190,150,255,.45);
  --glow-k:0 0 1px #ffe6f4,0 0 4px rgba(255,120,200,.9),0 0 11px rgba(255,90,180,.5);
  --glow-g:var(--glow-b-tight); --glow-g-soft:var(--glow-p-tight); --glow-a:var(--glow-k);
  --engrave:0 -1px 0 rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.16);
  --raise:0 1px 0 rgba(0,0,0,.9),1px 2px 3px rgba(0,0,0,.75);
}
/* steel text: engraved */
.panel,.ahead,.syncbar,.sheet,.bellpanel,.pop,.deck,.owner,.review,.slackbar{color:#eceef5;text-shadow:var(--engrave)}
.panel .muted,.ahead .muted,.syncbar .muted,.sheet .muted,.postto .hint,label.f span.hint,.item .meta,.ahead .stats,.bellpanel .muted{color:#cfd2de}
.panel b,.panel h2,.sheet h2,.ahead h2,label.f{color:#f4f5fa}
h3{color:#ffd27a;text-shadow:var(--engrave)}
.wtitle{text-shadow:var(--engrave)}
/* buttons: raised labels */
.btn,.tabs button,.seg button,.autopick button,.bell,.mover button,.revq{color:#f4f5fa;text-shadow:var(--raise)}
.autopick button b{color:#f4f5fa;text-shadow:var(--raise)}
.btn.link{color:var(--blue);text-shadow:var(--glow-b-tight)}
.btn.primary{color:#eafff0}
/* black displays: backlight tint */
.lcd,.list,.tabs,.hits,.msgs{background-color:#02030a;background-image:radial-gradient(ellipse at 30% 40%,rgba(90,160,255,.11),rgba(90,160,255,.03) 45%,rgba(0,0,0,0) 72%),radial-gradient(ellipse at 82% 70%,rgba(190,110,255,.08),rgba(0,0,0,0) 55%)}
.seg button[aria-pressed=true],.tabs button[aria-pressed=true],.autopick button[aria-pressed=true]{background-image:var(--scratch3),var(--glass),radial-gradient(ellipse at 50% 50%,rgba(90,170,255,.16),rgba(0,0,0,0) 75%);background-color:#02030a}
/* display text colours */
header.top h1{color:#c9f2ff;text-shadow:var(--glow-b)}
header.top .lede{color:var(--purple);text-shadow:var(--glow-p-tight)}
.lcd *{color:inherit}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true],.steps span.on,.toast,.empty b,.rank,.item .side{color:var(--blue);text-shadow:var(--glow-b-tight)}
.autopick button[aria-pressed=true] b{color:#e9f8ff;text-shadow:var(--glow-b-tight)}
.list .t{color:var(--orange);text-shadow:var(--glow-o-tight)}
.item .s{color:#ddd0ff;text-shadow:none}
.item .meta{color:#c7cad8;text-shadow:none}
.steps span{color:#8fb3c6;text-shadow:none}
.empty{color:#c7cad8;text-shadow:none}
.showlbl{color:var(--pink);text-shadow:var(--glow-k)}
.badge-owner{color:var(--pink);text-shadow:var(--glow-k);border-color:#7a3a62}
.code{text-shadow:0 0 3px currentColor}
.tabs button:not([aria-pressed=true]) .n{color:#d3d6e2}
/* inputs: crisp, readable */
input[type=text],textarea,select{color:#f2f9ff;text-shadow:0 0 2px rgba(143,227,255,.175);background-image:var(--scratch3),var(--glass),radial-gradient(ellipse at 30% 50%,rgba(90,160,255,.08),rgba(0,0,0,0) 70%)}
input::placeholder,textarea::placeholder{color:#9298ae;text-shadow:none;opacity:1}
select option{text-shadow:none}
/* glass dimmer behind text so it never fights the words */
.lcd::after,.list::after,.tabs::after,.hits::after,.msgs::after{filter:brightness(1.15)}

/* v6 specular: rounded glass highlights under the scratches */
.lcd::before,.list::before,.tabs::before,.hits::before,.msgs::before{content:"";position:absolute;left:3px;right:3px;top:3px;bottom:3px;border-radius:9px;pointer-events:none;z-index:1;mix-blend-mode:screen;
background:linear-gradient(180deg,rgba(235,240,255,.15) 0,rgba(220,230,255,.075) 9px,rgba(200,215,255,.025) 22px,rgba(0,0,0,0) 40px,rgba(0,0,0,0) calc(100% - 28px),rgba(200,215,255,.018) calc(100% - 14px),rgba(220,230,255,.055) calc(100% - 4px),rgba(235,240,255,.075) 100%)}
.lcd::before{border-radius:12px;background:linear-gradient(180deg,rgba(235,240,255,.17) 0,rgba(220,230,255,.085) 12px,rgba(200,215,255,.03) 30px,rgba(0,0,0,0) 56px,rgba(0,0,0,0) calc(100% - 36px),rgba(200,215,255,.02) calc(100% - 18px),rgba(220,230,255,.06) calc(100% - 5px),rgba(235,240,255,.08) 100%)}
input[type=text],textarea,select{background-image:var(--scratch3),linear-gradient(180deg,rgba(235,240,255,.12),rgba(220,230,255,.04) 6px,rgba(0,0,0,0) 14px,rgba(0,0,0,0) calc(100% - 9px),rgba(235,240,255,.05)),var(--glass),radial-gradient(ellipse at 30% 50%,rgba(90,160,255,.08),rgba(0,0,0,0) 70%);background-size:900px 630px,auto,auto,auto}
@media (prefers-reduced-transparency:reduce){.lcd::before,.list::before,.tabs::before,.hits::before,.msgs::before{display:none}}


/* v7: text glow at half strength */
:root{--glow-b:0 0 1px rgba(230,250,255,.45),0 0 4px rgba(110,210,255,.425),0 0 12px rgba(80,180,255,.25),0 0 24px rgba(60,150,255,.15);
--glow-b-tight:0 0 1px rgba(230,250,255,.35),0 0 3px rgba(110,210,255,.275);
--glow-o-tight:0 0 1px rgba(255,240,220,.35),0 0 3px rgba(255,160,60,.3);
--glow-p-tight:0 0 2px rgba(190,150,255,.225);
--glow-k:0 0 1px rgba(255,230,244,.5),0 0 4px rgba(255,120,200,.45),0 0 11px rgba(255,90,180,.25);
--glow-g:var(--glow-b-tight);--glow-g-soft:var(--glow-p-tight);--glow-a:var(--glow-k);
--glow-r:0 0 1px rgba(255,224,220,.5),0 0 4px rgba(255,90,70,.5),0 0 12px rgba(255,60,40,.325)}

/* v8: no glow on steel. Links engrave, codes sit in a black LCD chip */
.btn.link:not(:is(.lcd,.list,.tabs,.hits,.msgs,.toast) *){color:#d6f4ff;font-weight:600;text-shadow:var(--engrave);text-decoration-color:rgba(214,244,255,.55)}
.btn.link:not(:is(.lcd,.list,.tabs,.hits,.msgs,.toast) *):hover{color:#fff}
.code:not(:is(.lcd,.list,.tabs,.hits,.msgs,.toast) *){background:#05060c;border:1px solid;border-color:var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);padding:1px 6px;border-radius:2px;text-shadow:var(--glow-b-tight)}

/* v9: codes. Lighter fill, crisp edge, faint halo only */
.code{color:color-mix(in srgb,var(--c,#8fe3ff) 72%,#fff);font-weight:700;letter-spacing:.06em;text-shadow:0 1px 1px rgba(0,0,0,.9),0 0 6px color-mix(in srgb,var(--c,#8fe3ff) 30%,transparent)}
.code:not(:is(.lcd,.list,.tabs,.hits,.msgs,.toast) *){text-shadow:0 1px 1px rgba(0,0,0,.9),0 0 6px color-mix(in srgb,var(--c,#8fe3ff) 30%,transparent)}

/* end v10 */

/* v12 MedDev die-cut pin: brushed steel face, orange enamel band, steel rim, extruded. Centred, level. */
.pinfoot{display:flex;justify-content:center;align-items:center;margin-top:20px;padding:18px 16px 22px}
.mdpin{display:block;width:min(300px,78vw);height:auto;overflow:visible}

/* v11 fruit fly */
.ffly{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;z-index:9999;will-change:transform}
.ffly svg{display:block;width:18px;height:18px;overflow:visible}
.ffly .wing{transform-origin:9px 8px;transition:transform .15s}
.ffly.flying .wing{animation:fbuzz .03s linear infinite alternate}
.ffly.landed .wl{transform:rotate(14deg)}.ffly.landed .wr{transform:rotate(-14deg)}
.ffly.flying svg{filter:drop-shadow(0 6px 3px rgba(0,0,0,.35))}
.ffly.landed svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.ffly.rub .legf{animation:frub .12s ease-in-out infinite alternate}
@keyframes fbuzz{from{transform:scaleX(1) scaleY(1)}to{transform:scaleX(.35) scaleY(.9)}}
@keyframes frub{from{transform:translateY(0)}to{transform:translateY(1.2px)}}

/* v13 receiver faceplate: silkscreened spoof feature marks under the badge */
.pinfoot{flex-direction:column;gap:14px}
.faceplate{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 26px;max-width:980px;color:rgba(226,229,238,.8);text-shadow:0 1px 0 rgba(0,0,0,.65),0 -1px 0 rgba(255,255,255,.06)}
.fmark{display:inline-flex;align-items:center;gap:7px;font-family:Tahoma,Verdana,sans-serif;line-height:1}
.fmark svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;filter:drop-shadow(0 1px 0 rgba(0,0,0,.65))}
.fmark svg .fill{fill:currentColor;stroke:none}
.fmark>span{display:flex;flex-direction:column;gap:2px}
.fmark b{font-weight:700;font-size:.95rem;letter-spacing:.08em}
.fmark b i{font-style:italic;font-weight:900;margin-left:2px;letter-spacing:0}
.fmark small{font-size:.56rem;letter-spacing:.16em;font-weight:600;line-height:1.15}
.fmark.boxed{border:1.5px solid currentColor;padding:3px 7px 3px 5px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(0,0,0,.6)}
.fmark .big{font-size:1.45rem;font-style:italic;font-weight:900;letter-spacing:-.02em}
.fmark.pill{border:1.5px solid currentColor;border-radius:999px;padding:4px 10px;box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(0,0,0,.6)}
.fmark.pill b{font-size:1.1rem;letter-spacing:.18em}
.fmark .hd{font-size:1.15rem;font-style:italic;letter-spacing:.04em;border-bottom:2px solid currentColor;padding-bottom:1px}
.fmark.sq{flex-direction:column;gap:2px;border:1.5px solid currentColor;padding:4px 6px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(0,0,0,.6)}
.fmark.sq b{font-size:.85rem;letter-spacing:.02em;font-style:italic}
.specline{font:600 .6rem/1.3 Tahoma,Verdana,sans-serif;letter-spacing:.22em;color:rgba(226,229,238,.62);text-shadow:0 1px 0 rgba(0,0,0,.65);text-align:center}
.fmark.pill{background:none;color:inherit;font-family:Tahoma,Verdana,sans-serif}
.fmark.pill::before,.fmark.pill::after{content:none;display:none}
.faceplate{max-width:none;gap:10px 22px}

/* v14 spectrum analyzer: shares the header's right column with the badge and Activity */
header.top .hside{flex:0 1 340px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:240px}
header.top .hside>.row{justify-content:flex-end}
header.top .lcd.viz{flex:1 1 0;min-height:72px;min-width:0;padding:6px 7px;display:flex;position:relative}
.viz canvas{position:absolute;inset:6px 7px;width:calc(100% - 14px);height:calc(100% - 12px)}
/* when the header wraps, sit the buttons on the left and let the analyzer fill the rest of the row */
@media (max-width:900px){header.top .hside{flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:stretch}
 header.top .hside>.row{order:0;flex:0 0 auto;justify-content:flex-start}
}

.vizsw{display:inline-flex;align-items:center;gap:5px;font:700 .72rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.14em;color:#cfd2de;text-shadow:var(--engrave);cursor:pointer;user-select:none;margin-right:auto}
.vizsw input{margin:0;accent-color:#7fe22a;width:15px;height:15px;cursor:pointer}

/* v15 bug-spray nozzle + spray can */
html{overflow-x:clip}
header.top .vizwrap{position:relative;flex:1 1 50%;display:flex;min-height:72px}
header.top .vizwrap .lcd.viz{flex:1 1 auto}
.nozzle{position:absolute;right:-74px;bottom:-14px;width:112px;height:66px;padding:0;border:0;background:none;cursor:pointer;z-index:6;transition:transform .15s,opacity .12s}
.nozzle svg{display:block;width:100%;height:100%;overflow:visible}
.nozzle:hover{transform:translateY(-1px) scale(1.03)}
.nozzle:active{transform:translateY(2px) scale(.98)}
.nozzle.gone{opacity:0;pointer-events:none}
.nozzle:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
@media (max-width:1330px){.nozzle{right:-40px}}
@media (max-width:900px){header.top .vizwrap{order:1;flex:1 1 160px;min-height:52px;margin-right:62px}.nozzle{right:-66px;bottom:-10px;width:96px;height:56px}}
.spraycan{position:fixed;left:0;top:0;width:90px;height:320px;z-index:9997;pointer-events:none;transition:transform .5s cubic-bezier(.2,1.4,.4,1),clip-path .45s ease-out;filter:drop-shadow(6px 12px 10px rgba(0,0,0,.55))}
.spraycan.back{transition:transform .4s ease-in,clip-path .4s ease-in}
.spraycan svg{display:block}
.mistfx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9998}
.ffly.dead .wing{animation:none}
/* v16 light-colour deck: knobs nudge the red/green/blue of every lit display, relative to its stock colour */
.rmode{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.rdeck{display:flex;align-items:flex-start;gap:14px;margin-left:auto;padding:2px 0}
.rd-lcd.lcd{flex:none;min-width:104px;height:34px;padding:0 10px;display:flex;align-items:center;justify-content:center;margin-top:6px;font:1.35rem/1 var(--f-mono);letter-spacing:.08em;color:#8fe3ff;text-shadow:var(--glow-b-tight)}
.rd-btns{display:flex;gap:12px;margin-top:4px}
.rd-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.rd-btn button{width:24px;height:24px;border-radius:50%;padding:0;cursor:pointer;border:1px solid #000;
 background:radial-gradient(circle at 38% 30%,var(--btn-1) 0,var(--btn-2) 38%,var(--btn-3) 72%,#000 100%);box-shadow:0 2px 3px rgba(0,0,0,.7),0 0 0 2px var(--btn-bezel),0 0 0 3px var(--btn-rim)}
.rd-btn button:active,.rd-btn button[aria-pressed=true]{background:radial-gradient(circle at 50% 55%,var(--btn-down-1) 0,var(--btn-down-2) 55%,#000 100%);box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 0 0 2px var(--btn-bezel),0 0 0 3px var(--btn-rim)}
.rd-led{position:absolute;left:-11px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.rd-led.on{background:var(--led);box-shadow:0 0 6px var(--led),0 0 2px var(--led-core)}
.rdeck small,.rd-mm{font:700 .56rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.16em;color:var(--caption);text-shadow:0 1px 0 rgba(0,0,0,.65)}
.rd-knobs{display:flex;gap:10px}
.rd-k{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px}
.rd-dial{position:relative;width:52px;height:46px}
.rd-ticks{position:absolute;left:-4px;top:-5px;width:60px;height:60px;overflow:visible}
.rd-knob{position:absolute;left:8px;top:4px;width:36px;height:36px;border-radius:50%;cursor:grab;touch-action:none;outline-offset:3px;
 background:radial-gradient(circle at 36% 30%,var(--knob-1) 0,var(--knob-2) 30%,var(--knob-3) 62%,#000 100%);
 box-shadow:0 3px 4px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.08) inset}
.rd-knob::before{content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;
 background:repeating-conic-gradient(var(--knurl-1) 0 5deg,var(--knurl-2) 5deg 10deg);box-shadow:0 0 0 1px #000}
.rd-knob::after{content:"";position:absolute;left:50%;top:4px;width:3px;height:11px;margin-left:-1.5px;border-radius:2px;background:var(--kc);box-shadow:0 0 5px var(--kc)}
.rd-knob:active{cursor:grabbing}
.rd-k[data-ch=r] .rd-knob{--kc:#ff5a4a}.rd-k[data-ch=g] .rd-knob{--kc:#5aff6a}.rd-k[data-ch=b] .rd-knob{--kc:#5ab8ff}
.rd-mm{display:flex;justify-content:space-between;width:58px;font-size:.46rem;letter-spacing:.06em;margin-top:-2px;opacity:.8}
/* apply the tint only when a knob is off centre, and only to things that look lit */
html.rgbk :is(.lcd,.tabs .showlbl,.tabs button[aria-pressed=true],.list .item,.list .rank,.steps span,.badge-owner,.bell .count,.toast,.hits,.msgs,.rd-led,input[type=text],textarea,select,.empty){filter:url(#rgbk)}
html.rgbk :is(.code,.pill):not(:is(.list,.lcd,.hits,.msgs,.tabs) *){filter:url(#rgbk)}
html.rgbk .tabs button:not([aria-pressed=true]) :is(.sw,.n){filter:url(#rgbk)}
html.rgbk .autopick button[aria-pressed=true]::before{filter:url(#rgbk)}
/* narrow composer (desktop sidebar): deck takes its own line and wraps neatly */
.composer{container-type:inline-size}
@container (max-width:460px){.rmode .rdeck{width:100%;margin-left:0;flex-wrap:wrap;justify-content:flex-start;gap:8px 14px}.rd-btns{margin-left:12px}.rd-knobs{width:100%;justify-content:space-around}}
@media (max-width:520px){.rdeck{flex-wrap:wrap;justify-content:flex-end}}

/* v17 nozzle: white tip on a silver collar; label on the collar, carved into the tip only when the collar is hidden */
.nozzle{width:112px;height:82px;bottom:-2px}
.nozzle .nz-tiptext{display:none}
@media (max-width:900px){.nozzle{height:56px;bottom:-12px;overflow:hidden}.nozzle svg{height:82px}.nozzle .nz-colltext{display:none}.nozzle .nz-tiptext{display:inline}}

/* v18 side-lying spray can: rests at the right edge with its white tip in the header gap */
.nozzle{display:none}
header.top .vizwrap{margin-right:0!important}
.spraycan{position:absolute;left:0;top:0;width:90px;height:330px;padding:0;border:0;background:none;cursor:pointer;z-index:60;transform-origin:45px 14px;
 transition:transform .6s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(4px 8px 7px rgba(0,0,0,.6));clip-path:none}
.spraycan.aim{transition:none}
.spraycan svg{display:block;pointer-events:none}
.spraycan:not(.live):hover{filter:drop-shadow(4px 8px 7px rgba(0,0,0,.6)) brightness(1.08)}
.spraycan,.spraycan:focus,.spraycan:focus-visible{outline:none}
.spraycan:focus-visible{filter:drop-shadow(4px 8px 7px rgba(0,0,0,.6)) drop-shadow(0 0 3px var(--gold))}
.canlayer{position:absolute;left:0;top:0;width:100%;height:960px;overflow:hidden;pointer-events:none;z-index:60}
.canlayer .spraycan{pointer-events:auto}
.vizsw.sndsw{margin-right:0}
.sndsw+.vizsw{margin-right:auto}
.togs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-right:auto;min-width:0}
.vizsw .spk{width:18px;height:18px;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 -1px 0 rgba(255,255,255,.08))}
.vizsw input:not(:checked)+.spk{opacity:.55}
.togs .vizsw{margin-right:0!important}
.swatter{position:absolute;left:0;top:0;width:120px;height:340px;pointer-events:none;z-index:61;filter:drop-shadow(5px 9px 8px rgba(0,0,0,.6));display:none}
.swatter.live{display:block}
.swatter.hit svg{animation:swwob .16s ease-out}
@keyframes swwob{0%{transform:scaleX(1.06) scaleY(.96)}100%{transform:none}}

/* Analog VU pair */
.vu{display:flex;gap:12px;align-items:flex-start;flex:0 0 auto}
.vu-m{display:flex;flex-direction:column;align-items:center;gap:6px}
.vu-m small{font:700 .56rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.16em;color:var(--caption);text-shadow:0 1px 0 rgba(0,0,0,.65)}
.vu-glass{position:relative;width:clamp(150px,15vw,210px);aspect-ratio:1.65;padding:5px;border-radius:5px;
  background:linear-gradient(180deg,var(--bezel-1),var(--bezel-2) 45%,var(--bezel-3));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.6)}
.vu-glass canvas{display:block;width:100%;height:100%;border-radius:2px;box-shadow:inset 0 0 0 1px #000;filter:brightness(.42) saturate(.7);transition:filter .5s}
.vu.lit .vu-glass canvas{filter:none}
.vu-glass::after{content:"";position:absolute;inset:5px;border-radius:2px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.05) 38%,rgba(255,255,255,0) 39%,rgba(0,0,0,.12));box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}
.vu-pk{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:#4a0f0b;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);z-index:1}
.vu-pk.on{background:var(--led);box-shadow:0 0 6px 2px var(--led)}
html.rgbk .vu.lit .vu-glass canvas,html.rgbk .vu-pk.on{filter:url(#rgbk)}
.vu .vu-btn{align-self:center;margin-right:2px}
.vu .vu-btn small{font:700 .56rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.16em;color:var(--caption);text-shadow:0 1px 0 rgba(0,0,0,.65)}
.vu.off .vu-glass canvas{filter:brightness(.16) saturate(.4)}
.vu.off .vu-pk{background:#2a0a08}

/* ===== Receiver controls (shared: radio app and hub) ===== */
/* Tone knobs (LOW / MID / HIGH) and the big VOLUME knob, in the space beside the meters */
.mixer{flex:1 1 360px;display:flex;align-items:center;justify-content:flex-end;gap:18px;flex-wrap:wrap;min-width:0}
.tk{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px}
.tk-dial{position:relative;width:52px;height:46px}
.tk-ticks{position:absolute;left:-4px;top:-5px;width:60px;height:60px;overflow:visible}
.tk .rd-knob{--kc:var(--knob-pointer)}
.tk small,.vol small{font:700 .56rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.16em;color:var(--caption);text-shadow:0 1px 0 rgba(0,0,0,.65)}
.tk .rd-mm{width:58px}
.vol{display:flex;flex-direction:column;align-items:center;gap:6px;margin-left:8px}
.vol-dial{position:relative;width:140px;height:132px}
.vol-scale{position:absolute;left:0;top:0;width:140px;height:140px;overflow:visible}
.vol-num{position:absolute;transform:translate(-50%,-50%);font:700 8.5px/1 Tahoma,Verdana,sans-serif;color:var(--caption);pointer-events:none;user-select:none;-webkit-text-size-adjust:none;text-size-adjust:none}
.vol-knob{position:absolute;left:28px;top:28px;width:84px;height:84px;border-radius:50%;cursor:grab;touch-action:none;outline-offset:4px;
  background:radial-gradient(circle at 50% 50%,var(--vol-cap) 0 18%,transparent 19%),
    repeating-conic-gradient(from 0deg,var(--vol-knurl-1) 0 2deg,var(--vol-knurl-2) 2deg 4deg,var(--vol-knurl-3) 4deg 6deg),
    radial-gradient(circle at 35% 30%,var(--vol-1),var(--vol-2) 60%,var(--vol-3));
  box-shadow:0 6px 10px rgba(0,0,0,.7),0 0 0 3px var(--btn-bezel),0 0 0 5px var(--btn-rim),inset 0 2px 2px rgba(255,255,255,.6),inset 0 -3px 5px rgba(0,0,0,.35)}
.vol-knob::before{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--vol-1),var(--vol-2) 70%,var(--vol-3));box-shadow:inset 0 1px 2px rgba(255,255,255,.7),inset 0 -2px 4px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.45)}
.vol-knob:active{cursor:grabbing}
.vol-dot{position:absolute;left:50%;top:9px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--vol-dot);box-shadow:0 0 6px var(--vol-dot),0 0 2px var(--knob-pointer);z-index:1}
.vol-knob:focus-visible,.tk-knob:focus-visible{outline:2px solid var(--gold)}
@media (max-width:760px){.mixer{justify-content:center}}
.fxbtns{align-self:center;display:flex;gap:14px}
.fxbtns small{font:700 .56rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.16em;color:var(--caption);text-shadow:0 1px 0 rgba(0,0,0,.65);white-space:nowrap}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px}
.types .opt small{color:#9a9db0;font-size:.8rem}
.opt{display:flex;gap:8px;align-items:center;color:#e6e6ee}
.opt input{width:16px;height:16px;flex:none;accent-color:var(--lcd)}
@media (max-width:480px){.vu{gap:8px}.vu-glass{width:min(128px,36vw)}}

/* SOUND and EQ switches look and act like the receiver's other buttons (METER, LET IT RIDE…): a round black
   push button with a red LED beside it and an engraved caption under it. Still checkboxes underneath. */
.togs{flex-direction:row;align-items:flex-start;gap:20px;padding-left:12px}
.vizsw{position:relative;flex-direction:column;align-items:center;gap:5px;font:700 .56rem/1 Tahoma,Verdana,sans-serif;letter-spacing:.16em;color:var(--caption);text-shadow:0 1px 0 rgba(0,0,0,.65)}
.vizsw input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin:0;cursor:pointer;border:1px solid #000;
 background:radial-gradient(circle at 38% 30%,var(--btn-1) 0,var(--btn-2) 38%,var(--btn-3) 72%,#000 100%);box-shadow:0 2px 3px rgba(0,0,0,.7),0 0 0 2px var(--btn-bezel),0 0 0 3px var(--btn-rim)}
.vizsw input:checked,.vizsw input:active{background:radial-gradient(circle at 50% 55%,var(--btn-down-1) 0,var(--btn-down-2) 55%,#000 100%);box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 0 0 2px var(--btn-bezel),0 0 0 3px var(--btn-rim)}
.vizsw input:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.vizsw::before{content:"";position:absolute;left:-11px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.vizsw:has(input:checked)::before{background:var(--led);box-shadow:0 0 6px var(--led),0 0 2px var(--led-core)}
html.rgbk .vizsw::before{filter:url(#rgbk)}
.vizsw .spk{display:none}
.vizsw.sndsw::after{content:"SOUND"}

/* ===== Skin settings =====
   Everything a skin may change, with the Default (steel Winamp-style) values. A skin is a stylesheet that overrides some of
   these under :root (plus the older ones above: --steel-*, --lcd*, --glass, --gold*, --glow-*, --f-*), and may add images
   as data: URLs. Canvas parts (LED EQ, VU faces) read the --eq-* and --vu-* values too. Layout is not skinnable. */
:root{
  --led:#ff3b2a; --led-core:#ffb0a0; --led-off:#3a0d0a; --caption:rgba(226,229,238,.82); --focus:#ffd23f;
  --btn-1:#6b6e7a; --btn-2:#2a2c33; --btn-3:#0b0c0f; --btn-down-1:#3a3c44; --btn-down-2:#15161a; --btn-bezel:#1a1b20; --btn-rim:#4a4d58;
  --knob-1:#62656f; --knob-2:#26282e; --knob-3:#0e0f12; --knurl-1:#33353d; --knurl-2:#0a0b0e; --knob-pointer:#ffd27a;
  --vol-1:#f2f3f7; --vol-2:#8f93a0; --vol-3:#4a4d58; --vol-cap:#c9ccd6; --vol-knurl-1:#d9dce4; --vol-knurl-2:#9a9eaa; --vol-knurl-3:#c6c9d2; --vol-dot:#ff9a1f;
  --bezel-1:#5d606b; --bezel-2:#2a2c33; --bezel-3:#17181d;
  --plate-1:#4d5060; --plate-2:#363845; --plate-3:#24252e; --key-1:#5e6174; --key-2:#33353f; --key-hover-1:#575a6e; --key-hover-2:#353744; --title-1:#22232c; --title-2:#14151b;
  --eq-1:#1ec81e; --eq-2:#7fe22a; --eq-3:#e8e030; --eq-4:#ff9a1e; --eq-5:#ff3b2a; --eq-off:rgba(60,90,60,.16); --eq-peak:#d8dbe6;
  --vu-face-1:#fbf0cf; --vu-face-2:#f0dfae; --vu-face-3:#cdb57a; --vu-ink:#1b1a17; --vu-red:#c8231b; --vu-needle:#111;
}
/* Skin decorations: a skin can draw on .skin-decor (and its ::before/::after), which sits over each .deck and .panel.
   It may overlap the glass a little (a tentacle over an LCD corner), but it never takes a click. */
.skin-decor{position:absolute;inset:0;z-index:4;overflow:visible;pointer-events:none!important}
.skin-decor::before,.skin-decor::after{pointer-events:none!important}
:is(.deck,.panel):has(> .skin-decor){position:relative}

    const name={r:"rEd",g:"GrEEn",b:"bLUE"}; if(hi[0][1]-hi[1][1]>.25) return name[hi[0][0]];

/* MedDev Receiver controls (used by MDFM Radio, the Media Development Hub and MD Hub):
   LOW / MID / HIGH tone knobs (-12..+12 dB, centre = flat), the big VOLUME knob, LET IT RIDE and UNDERWATER (Collin's modes),
   and the "What plays between songs" checkboxes. Knobs: drag up/right, scroll, or arrow keys; double-click resets.

   Usage: MDFM_receiver(radio, { app })   (looks for the standard element ids/classes; anything missing is skipped) */
window.MDFM_receiver=function(radio,{app=null}={}){
  const $=s=>document.querySelector(s);
  // LOW / MID / HIGH tone knobs (-12..+12 dB, centre = flat) and the big VOLUME knob. Drag up/right, scroll, or use the arrow keys;
  // double-click puts a knob back. Remembered on this device.
  { const load=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }, save=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
    const tone=Object.assign({low:0,mid:0,high:0},load("mdfmTone",{})); let vol=load("mdfmVolume",.8);
    const ticks=(svg,n,r,cx,big)=>{ let h=""; for(let i=0;i<=n;i++){ const a=(-135+i*270/n)*Math.PI/180, major=i===0||i===n||i===n/2; h+=`<circle cx="${cx+Math.sin(a)*r}" cy="${cx-Math.cos(a)*r}" r="${major?1.5:.9}" fill="rgba(226,229,238,.75)"/>`; } svg.innerHTML=h+(big||""); };
    document.querySelectorAll(".tk-ticks").forEach(s=>ticks(s,10,27,30));
    // The VOLUME scale: dots in the SVG, numbers as plain positioned text (SVG text drifts out of place in iPhone Safari).
    document.querySelectorAll(".vol-scale").forEach(sc=>{ ticks(sc,40,54,70); const dial=sc.parentElement; if(!dial) return;
      dial.querySelectorAll(":scope > .vol-num").forEach(n=>n.remove());
      for(let i=0;i<=10;i++){ const a=(-135+i*27)*Math.PI/180, n=document.createElement("span"); n.className="vol-num"; n.setAttribute("aria-hidden","true");
        n.textContent=String(i); n.style.left=(70+Math.sin(a)*64)+"px"; n.style.top=(70-Math.cos(a)*64)+"px"; dial.appendChild(n); } });
    const knob=(el,get,set,min,max,step,fmt,reset)=>{ if(!el) return; const show=()=>{ const v=get(), f=(v-min)/(max-min); el.style.transform=`rotate(${-135+f*270}deg)`; el.setAttribute("aria-valuenow",String(Math.round(v*10)/10)); el.setAttribute("aria-valuetext",fmt(v)); el.title=fmt(v); };
      const put=v=>{ set(Math.max(min,Math.min(max,v))); show(); }; let sx=0,sy=0,sv=0;
      el.addEventListener("pointerdown",e=>{ el.setPointerCapture(e.pointerId); sx=e.clientX; sy=e.clientY; sv=get(); e.preventDefault(); e.stopPropagation(); });
      el.addEventListener("pointermove",e=>{ if(!el.hasPointerCapture(e.pointerId)) return; put(sv+((e.clientX-sx)-(e.clientY-sy))/150*(max-min)); });
      el.addEventListener("wheel",e=>{ e.preventDefault(); put(get()-Math.sign(e.deltaY)*step); },{passive:false});
      el.addEventListener("dblclick",()=>put(reset));
      el.addEventListener("keydown",e=>{ const k=e.key, st=e.shiftKey?step*4:step; if(k==="ArrowUp"||k==="ArrowRight") put(get()+st); else if(k==="ArrowDown"||k==="ArrowLeft") put(get()-st); else if(k==="Home") put(min); else if(k==="End") put(max); else return; e.preventDefault(); });
      show(); };
    radio.setTone(tone); radio.setVolume(vol);
    document.querySelectorAll(".tk").forEach(t=>{ const b=t.dataset.band; knob(t.querySelector(".tk-knob"),()=>tone[b],v=>{ tone[b]=Math.round(v*2)/2; radio.setTone({[b]:tone[b]}); save("mdfmTone",tone); },-12,12,1,v=>`${b[0].toUpperCase()+b.slice(1)} ${v>0?"+":""}${v} dB`,0); });
    knob(document.querySelector(".vol-knob"),()=>vol,v=>{ vol=Math.round(v*100)/100; radio.setVolume(vol); save("mdfmVolume",vol); },0,1,.05,v=>`Volume ${Math.round(v*10*10)/10}`,.8); }
  // Collin's sound modes: LET IT RIDE (longer songs) and UNDERWATER. Remembered on this device.
  const mode=(btn,led,key,set,get)=>{ const b=$(btn); if(!b) return; let v=false; try{ v=localStorage.getItem(key)==="1"; }catch(e){}
    const show=()=>{ b.setAttribute("aria-pressed",String(get())); $(led).classList.toggle("on",get()); };
    if(v) set(true); show();
    b.addEventListener("click",e=>{ if(e.detail>0) b.blur(); set(!get()); show(); try{ localStorage.setItem(key,get()?"1":"0"); }catch(err){} }); };
  if(radio.setLetItRide) mode("#rideBtn","#rideLed","mdfmRide",v=>radio.setLetItRide(v),()=>radio.isLetItRide());
  if(radio.setUnderwater) mode("#uwBtn","#uwLed","mdfmUnderwater",v=>radio.setUnderwater(v),()=>radio.isUnderwater());
  // Content types people can switch off. In the app they're saved with the app settings; in a browser, on this device.
  const TYPES=(window.MDFM_TYPES||[]).map(([k,label])=>[k,label,k==="news"&&!app?"app only":""]);
  const typeList=$("#typeList"); let types={}; if(!typeList) return;
  try{ types=app?(app.settings.get().types||{}):JSON.parse(localStorage.getItem("mdfmTypes")||"{}"); }catch(e){}
  if(app) types.news=!!app.settings.get().slackNews;
  for(const [k,label,note] of TYPES){ const l=document.createElement("label"); l.className="opt";
    l.innerHTML=`<input type="checkbox" data-type="${k}"${k==="news"?' id="setSlackNews"':""}> <span>${label}${note?` <small>(${note})</small>`:""}</span>`;
    const cb=l.querySelector("input"); cb.checked=types[k]!==false; if(k==="news"&&!app){ cb.disabled=true; cb.checked=false; } typeList.appendChild(l); }
  const typeState=()=>{ const t={}; typeList.querySelectorAll("input[data-type]").forEach(cb=>t[cb.dataset.type]=cb.checked); return t; };
  radio.setTypes(typeState());
  typeList.addEventListener("change",()=>{ const t=typeState(); radio.setTypes(t);
    if(app) app.settings.set({types:t,slackNews:t.news}); else try{ localStorage.setItem("mdfmTypes",JSON.stringify(t)); }catch(e){} });
  // In MD Hub the same switches are in the app's Settings too: follow changes made there.
  if(app&&app.settings.onChange) app.settings.onChange(s=>{ if(!s) return; const t=Object.assign({},s.types||{}); if("slackNews" in s) t.news=!!s.slackNews;
    typeList.querySelectorAll("input[data-type]").forEach(cb=>{ if(cb.dataset.type in t) cb.checked=t[cb.dataset.type]!==false; }); radio.setTypes(typeState()); });
};

/* Skins: pick how the receiver looks. The page carries the skins in a JSON script tag with id "meddev-skins"
   (MD Hub can hand a newer set through window.mdfmApp.skins()). Choice: the person's own pick, else the house default.
   In an app it's saved with the app's settings (and on this device as a fallback); in a browser, on this device.
   Any select element with data-mdfm-skins becomes a skin dropdown. A skin is CSS only; it is applied in the style tag "meddev-skin-theme". */
(()=>{
  const newer=(a,b)=>{ const p=v=>String(v||"0.0.0").split(".").map(n=>parseInt(n,10)||0), x=p(a), y=p(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return x[i]>y[i]; return false; };
  const app=()=>window.mdfmApp||null;
  let bundle=null;
  const load=()=>{ let b=null; try{ const el=document.getElementById("meddev-skins"); if(el) b=JSON.parse(el.textContent); }catch(e){}
    try{ const a=app(); if(a&&typeof a.skins==="function"){ const n=a.skins(); if(n&&n.skins&&(!b||newer(n.version,b.version))) b=n; } }catch(e){}
    return b&&Array.isArray(b.skins)?b:{ version:"0.0.0", default:"default", skins:[{ id:"default", name:"Default", description:"", css:"" }] }; };
  const find=id=>bundle.skins.find(s=>s.id===id);
  const KEY="mdfmSkin";
  const choice=()=>{ try{ const a=app(); if(a&&a.settings){ const v=(a.settings.get()||{}).skin; if(typeof v==="string") return v; } }catch(e){} try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } };
  const save=id=>{ try{ localStorage.setItem(KEY,id); }catch(e){} try{ const a=app(); if(a&&a.settings) a.settings.set({skin:id}); }catch(e){} };
  let styleEl=null;
  const theme=()=>{ if(styleEl&&styleEl.isConnected) return styleEl; styleEl=document.getElementById("meddev-skin-theme");
    if(!styleEl){ styleEl=document.createElement("style"); styleEl.id="meddev-skin-theme"; (document.head||document.documentElement).appendChild(styleEl); } return styleEl; };
  function apply(id){
    const pick=find(id)||find(bundle.default)||find("default")||bundle.skins[0];
    const css=pick?pick.css||"":""; if(theme().textContent!==css) theme().textContent=css;
    document.documentElement.dataset.skin=pick?pick.id:"default";
    decor(/skin-decor/.test(css));
    fill(); try{ window.dispatchEvent(new Event("meddev:skin")); }catch(e){}
    return pick;
  }
  // decorations: one .skin-decor over each .deck and .panel, only while a skin uses them
  function decor(on){
    document.querySelectorAll(".deck,.panel").forEach(el=>{ let d=el.querySelector(":scope > .skin-decor");
      if(on&&!d){ d=document.createElement("i"); d.className="skin-decor"; d.setAttribute("aria-hidden","true"); d.dataset.part=el.classList.contains("deck")?"deck":"panel"; el.appendChild(d); }
      else if(!on&&d) d.remove(); });
  }
  function fill(){
    const cur=choice(), house=find(bundle.default)||bundle.skins[0];
    document.querySelectorAll("select[data-mdfm-skins]").forEach(sel=>{
      if(sel.dataset.filled!==bundle.version+":"+bundle.skins.length+":"+bundle.default){ sel.textContent="";
        const o=document.createElement("option"); o.value=""; o.textContent=`House default (${house?house.name:"Default"})`; sel.appendChild(o);
        for(const s of bundle.skins){ const op=document.createElement("option"); op.value=s.id; op.textContent=s.name; if(s.description) op.title=s.description; sel.appendChild(op); }
        sel.dataset.filled=bundle.version+":"+bundle.skins.length+":"+bundle.default; }
      sel.value=find(cur)?cur:"";
      if(!sel.dataset.wired){ sel.dataset.wired="1"; sel.addEventListener("change",()=>{ save(sel.value); apply(sel.value); }); }
    });
  }
  const start=()=>{ bundle=load(); apply(choice());
    try{ const a=app(); if(a&&a.settings&&a.settings.onChange) a.settings.onChange(s=>{ if(s&&"skin" in s) apply(s.skin||""); }); }catch(e){} };
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
  window.MDFM_skins={ list:()=>bundle?bundle.skins.map(({id,name,description})=>({id,name,description})):[], houseDefault:()=>bundle&&bundle.default,
    current:()=>document.documentElement.dataset.skin, set:id=>{ save(id||""); return apply(id||""); }, refresh:()=>{ bundle=load(); apply(choice()); } };
})();

window.MedDevReceiver={version:"1.2.0",mountBadges:()=>window.MDFM_mountBadges(),mountControls:(radio,o)=>window.MDFM_receiver(radio,o||{})};
</script>
