# Builds and tests the MedDev Receiver on every push and pull request.
name: tests
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: dist is up to date (run npm run build and commit dist/)
        run: git diff --exit-code dist/
